<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - Part 4: To-Do List</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        nav {
            background-color: #2c3e50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav .logo {
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            color: #ecf0f1;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            background-color: #34495e;
            color: #3498db;
        }

        .main-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 25px;
        }

        .form-card {
            background: white;
            padding: 35px 30px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            background-color: #f9f9f9;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #4338ca;
            background-color: #fff;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        .btn-add {
            background-color: #4338ca;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #3730a3;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-card {
            background: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            position: relative;
            transition: all 0.2s ease;
        }

        .task-card.completed {
            opacity: 0.6;
        }

        .task-card.completed .task-title,
        .task-card.completed .task-desc {
            text-decoration: line-through;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .task-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #222;
            cursor: pointer;
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-check {
            cursor: pointer;
            color: #6b7280;
            font-size: 1.1rem;
            user-select: none;
        }

        .btn-check:hover {
            color: #10b981;
        }

        .btn-delete {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
            font-size: 1.1rem;
            user-select: none;
        }

        .btn-delete:hover {
            color: #dc2626;
        }

        .task-desc {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
            white-space: pre-wrap;
        }

        .empty-msg {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Assignment 5</div>
        <ul>
            <li><a href="index.html">Part 1</a></li>
            <li><a href="part2.html">Part 2</a></li>
            <li><a href="part3.html">Part 3</a></li>
            <li><a href="part4.html" class="active">Part 4</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <div>
            <div class="section-title">To-do list</div>
            <div id="tasksList" class="tasks-container">
                <p id="emptyMessage" class="empty-msg">Добавьте новую задачу справа!</p>
            </div>
        </div>

        <div>
            <div class="section-title">Add new task</div>
            <div class="form-card">
                <form id="todoForm">
                    <div class="form-group">
                        <label for="taskTitle">Title</label>
                        <input type="text" id="taskTitle" required placeholder="Введите название задачи">
                    </div>
                    <div class="form-group">
                        <label for="taskDesc">Description</label>
                        <textarea id="taskDesc" required placeholder="Введите описание задачи"></textarea>
                    </div>
                    <button type="submit" class="btn-add">Add task</button>
                </form>
            </div>
        </div>

    </div>

    <script src="script4.js"></script>
</body>
</html>
