<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - Part 3: Events & Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        nav {
            background-color: #2c3e50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav .logo {
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            color: #ecf0f1;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            background-color: #34495e;
            color: #3498db;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .card {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 4px 4px 0;
        }

        .card h2 {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .hover-box {
            width: 100%;
            height: 100px;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .text-input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            outline: none;
        }

        .text-input:focus {
            border-color: #3498db;
        }

        .output-display {
            font-weight: 600;
            color: #2c3e50;
        }

        .calc-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .calc-inputs input {
            width: 50%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .calc-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .calc-buttons button {
            flex: 1;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calc-buttons button:hover {
            background-color: #2980b9;
        }

        .calc-result {
            font-size: 1.1rem;
            font-weight: bold;
            color: #27ae60;
            padding: 10px;
            background: #e8f8f5;
            border-radius: 4px;
            border-left: 4px solid #27ae60;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Assignment 5</div>
        <ul>
            <li><a href="index.html">Part 1</a></li>
            <li><a href="part2.html">Part 2</a></li>
            <li><a href="part3.html" class="active">Part 3</a></li>
            <li><a href="part4.html">Part 4</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Part 3: Events</h1>

        <div class="card">
            <h2>Task 5: Mouse Events</h2>
            <div id="hoverBox" class="hover-box">
                Наведите курсор!
            </div>
        </div>

        <div class="card">
            <h2>Task 6: Keyboard Events</h2>
            <input type="text" id="liveInput" class="text-input" placeholder="Начните вводить текст...">
            <p>Текущее значение: <span id="liveOutput" class="output-display">...</span></p>
        </div>

        <div class="card">
            <h2>Task 7: Calculator</h2>
            <div class="calc-inputs">
                <input type="number" id="num1" placeholder="Первое число">
                <input type="number" id="num2" placeholder="Второе число">
            </div>
            <div class="calc-buttons">
                <button onclick="calculate('+')">+</button>
                <button onclick="calculate('-')">-</button>
                <button onclick="calculate('*')">×</button>
                <button onclick="calculate('/')">÷</button>
            </div>
            <div class="calc-result">
                Результат: <span id="calcResult">0</span>
            </div>
        </div>
    </div>

    <script src="script3.js"></script>
</body>
</html>
